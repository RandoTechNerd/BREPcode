# Desktop builds: BREPcode (standard, Rust kernel) and BREPcode Alpha (NVIDIA's
# SMLib kernel first, Rust and the JS kernel as fallbacks), for Apple Silicon
# and Windows. Every run uploads the apps as workflow artifacts; a v* tag also
# puts them on a DRAFT GitHub release, which stays private until published.
name: Desktop builds

on:
  push:
    branches: [nvidia-alpha, split-and-scroll, main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: "Mac (Apple Silicon)",       os: macos-14,       script: "desktop:build:mac",       nvidia: false, out: "dist-desktop/*.dmg" }
          - { label: "Mac Alpha (NVIDIA kernel)",  os: macos-14,       script: "desktop:build:mac:alpha", nvidia: true,  out: "dist-desktop/*.dmg" }
          - { label: "Windows",                    os: windows-latest, script: "desktop:build:public",    nvidia: false, out: "dist-desktop/*.exe" }
          - { label: "Windows Alpha (NVIDIA kernel)", os: windows-latest, script: "desktop:build:alpha", nvidia: true,  out: "dist-desktop/*.exe" }
    env:
      # unsigned builds: don't go looking for a signing identity
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # the toolchain pinned in rust/brepcode-native/rust-toolchain.toml
      - name: Rust toolchain
        shell: bash
        run: |
          rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust/brepcode-native/rust-toolchain.toml)" --profile minimal
          rustc --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/brepcode-native

      - name: Cache the NVIDIA kernel build
        if: matrix.nvidia
        uses: actions/cache@v4
        with:
          path: |
            native/nvidia-kernel/upstream
            native/nvidia-kernel/build
          key: nvidia-${{ runner.os }}-${{ hashFiles('native/nvidia-kernel/fetch-upstream.mjs', 'native/nvidia-kernel/binding.gyp', 'native/nvidia-kernel/src/**') }}
          restore-keys: nvidia-${{ runner.os }}-

      - name: Install
        run: npm ci

      - name: Build the app
        run: npm run ${{ matrix.script }}

      # The alpha's own check: NVIDIA's kernel loads in this build and makes
      # real solids with the right volumes and face names.
      - name: NVIDIA kernel check
        if: matrix.nvidia
        run: node test/nvidia.js

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: ${{ matrix.out }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: Draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: apps
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: apps/**/*
