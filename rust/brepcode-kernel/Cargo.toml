# BREPcode's build of the Rust BREP kernel: the kernel's own wasm exports plus
# the STL -> exact B-rep reconstruction (stl2step's engine), in ONE wasm so the
# browser doesn't load the kernel twice. Upstream: the next.BREP.io Rust BREP
# kernel by mmiscool (github.com/mmiscool/next.BREP.io_RUST_BREP_KERNEL),
# pinned to a commit and used unmodified.
[package]
name = "brep_kernel"
version = "0.11.0-brepcode.1"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
kernel = { package = "BREP_kernel", git = "https://github.com/mmiscool/next.BREP.io_RUST_BREP_KERNEL", rev = "4661b90d764a7b58c2ddba18a048f80e51463221" }
brep_reconstruction = { package = "BREP_reconstruction", git = "https://github.com/mmiscool/next.BREP.io_RUST_BREP_KERNEL", rev = "4661b90d764a7b58c2ddba18a048f80e51463221" }
wasm-bindgen = "0.2"
serde_json = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
overflow-checks = false
